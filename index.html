
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Another Life - Oakwood</title>

<style>
* {
  box-sizing: border-box;
  touch-action: none;
}

body {
  margin: 0;
  overflow: hidden;
  background: #9cc7d2;
  font-family: Arial, sans-serif;
  color: white;
}

#game {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
}

#title {
  position: fixed;
  top: 12px;
  left: 12px;
  background: #172b35cc;
  padding: 10px 14px;
  border-radius: 12px;
  font-weight: bold;
  z-index: 2;
}

#mission {
  position: fixed;
  top: 60px;
  left: 12px;
  background: #172b35cc;
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 12px;
}

#joystick {
  position: fixed;
  left: 24px;
  bottom: 25px;
  width: 120px;
  height: 120px;
  border: 2px solid #ffffffaa;
  background: #ffffff30;
  border-radius: 50%;
  z-index: 3;
}

#stick {
  position: absolute;
  left: 34px;
  top: 34px;
  width: 48px;
  height: 48px;
  background: #ffffffdd;
  border-radius: 50%;
}

.actions {
  position: fixed;
  right: 18px;
  bottom: 25px;
  display: flex;
  gap: 10px;
  z-index: 3;
}

button {
  border: 1px solid white;
  background: #214b5bdd;
  color: white;
  border-radius: 50%;
  width: 65px;
  height: 65px;
  font-weight: bold;
  font-size: 11px;
}

#jump {
  width: 76px;
  height: 76px;
  background: #b87851;
}

#toast {
  position: fixed;
  bottom: 160px;
  left: 50%;
  transform: translateX(-50%);
  background: #172b35dd;
  padding: 10px 16px;
  border-radius: 20px;
  opacity: 0;
  transition: opacity .2s;
  white-space: nowrap;
  z-index: 4;
}

#start {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(140deg,#183b48,#376d68);
  text-align: center;
  padding: 20px;
}

.panel {
  max-width: 420px;
  background: #102630dd;
  padding: 28px;
  border-radius: 22px;
  border: 1px solid #ffffff44;
}

.panel h1 {
  font-size: 36px;
  margin: 10px 0;
}

.panel p {
  line-height: 1.5;
  color: #dce8e8;
}

#play {
  width: auto;
  height: auto;
  border-radius: 12px;
  background: #e5a273;
  color: #172b35;
  padding: 14px 25px;
  font-size: 16px;
}

#rotate {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 8;
  background: #142d38;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 22px;
}

@media (orientation: portrait) {
  #rotate { display: flex; }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="title">ANOTHER LIFE · OAKWOOD</div>
<div id="mission">MISSION 01 · Explore Oakwood</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div class="actions">
  <button id="wave">WAVE</button>
  <button id="talk">TALK</button>
  <button id="jump">JUMP</button>
</div>

<div id="toast"></div>

<div id="rotate">
  ↻<br><br>Please rotate your phone to landscape.
</div>

<div id="start">
  <div class="panel">
    <div style="font-size:45px">🌴</div>
    <h1>ANOTHER LIFE<br>OAKWOOD</h1>
    <p>Two lives. One city. Infinite possibilities.</p>
    <p>Explore your new home, meet friends and discover a new life.</p>
    <button id="play">ENTER OAKWOOD</button>
  </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ====================================
// GAME SETUP
// ====================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9cc7d2);
scene.fog = new THREE.Fog(0x9cc7d2, 45, 180);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 300
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.querySelector("#game").appendChild(renderer.domElement);

// ====================================
// LIGHTING
// ====================================

scene.add(new THREE.HemisphereLight(
  0xe7f5ff, 0x65704c, 2
));

const sunlight = new THREE.DirectionalLight(
  0xffedcf, 2.5
);

sunlight.position.set(-35, 50, 25);
sunlight.castShadow = true;
sunlight.shadow.mapSize.set(1024, 1024);

scene.add(sunlight);

// ====================================
// MATERIALS
// ====================================

function material(color, roughness = 0.85) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness
  });
}

const grass = material(0x66885d);
const asphalt = material(0x454c50);
const pavement = material(0xc4bca8);
const sand = material(0xd8c18e);
const sea = material(0x4b9eae, 0.3);

// ====================================
// WORLD BUILDING
// ====================================

function ground(width, depth, mat, x, z) {
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(width, depth),
    mat
  );

  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x, 0, z);
  mesh.receiveShadow = true;

  scene.add(mesh);
  return mesh;
}

function block(width, height, depth, mat, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    mat
  );

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  scene.add(mesh);
  return mesh;
}

ground(220, 220, grass, 0, 0);
ground(220, 34, sand, 0, -82);
ground(220, 55, sea, 0, -126);

// Main roads
ground(220, 13, asphalt, 0, 8);
ground(220, 2, pavement, 0, 15);
ground(220, 2, pavement, 0, 1);

ground(13, 180, asphalt, -42, 0);
ground(13, 180, asphalt, 43, 0);

// Road markings
const roadLine = material(0xe7dfbd);

for (let x = -100; x < 110; x += 12) {
  block(5, 0.04, 0.15, roadLine, x, 0.03, 8);
}

// ====================================
// BUILDINGS
// ====================================

function building(x, z, width, depth, height, color) {

  const wall = material(color);
  const roof = material(0x55565a);
  const glass = material(0x8fc3d1, 0.25);
  const trim = material(0xf0e6d4);

  block(width, height, depth,
    wall, x, height / 2, z);

  block(width + 1, 0.55, depth + 1,
    roof, x, height + 0.25, z);

  // Windows
  for (let y = 1.5; y < height - 1; y += 2.1) {

    for (let xx = -width / 2 + 1.2;
         xx < width / 2 - 0.5;
         xx += 2.3) {

      block(0.95, 1.05, 0.09,
        glass, x + xx, y, z + depth / 2 + 0.05);

      block(0.98, 0.08, 0.12,
        trim, x + xx, y - 0.58, z + depth / 2 + 0.1);
    }
  }

  // Entrance
  block(1.5, 2.4, 0.13,
    material(0x604936),
    x, 1.2, z + depth / 2 + 0.08);
}

// Oakwood neighbourhood
building(-24, 28, 15, 13, 10, 0xe5c9a5); // Cafe
building(22, 29, 17, 14, 13, 0xd7d8cf); // Apartments
building(-67, 24, 16, 15, 12, 0xd6b6a1); // Police
building(67, 27, 18, 15, 14, 0xd5c6a8); // Hospital

building(-23, -20, 19, 15, 9, 0xc4d0bc); // Market
building(23, -22, 18, 15, 11, 0xe1c2a4); // Beach apartments
building(68, -22, 16, 15, 9, 0xc8d2d5); // Library
building(-68, -22, 18, 15, 10, 0xd9c9b2); // Town hall

// ====================================
// TREES AND PARK
// ====================================

function tree(x, z, scale = 1) {

  const trunk = material(0x70523a);
  const leaves = material(0x386b4c);

  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(
      0.22 * scale,
      0.32 * scale,
      2.2 * scale,
      8
    ),
    trunk
  );

  stem.position.set(x, 1.1 * scale, z);
  stem.castShadow = true;
  scene.add(stem);

  const crown = new THREE.Mesh(
    new THREE.SphereGeometry(1.25 * scale, 12, 10),
    leaves
  );

  crown.position.set(x, 2.65 * scale, z);
  crown.castShadow = true;
  scene.add(crown);
}

for (let x = -95; x <= 95; x += 13) {
  tree(x, 42, 0.9);
  tree(x, -45, 0.8);
}

for (let z = -60; z < 55; z += 15) {
  tree(-83, z);
  tree(84, z);
}

// Park
ground(38, 32, material(0x7d9a68), 0, 61);

for (let x = -12; x <= 12; x += 12) {
  tree(x, 57);
}

block(10, 0.35, 2,
  material(0x8c755c), 0, 0.5, 64);

// ====================================
// CHARACTERS
// ====================================

function character(name, shirt, trousers, x, z) {

  const group = new THREE.Group();
  group.position.set(x, 0, z);

  scene.add(group);

  const skin = material(0xd7a47f);
  const top = material(shirt);
  const pants = material(trousers);
  const hair = material(0x29221f);
  const shoes = material(0x282c31);

  const torso = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.42, 0.8, 5, 10),
    top
  );

  torso.position.y = 1.45;
  torso.castShadow = true;
  group.add(torso);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.31, 16, 12),
    skin
  );

  head.position.y = 2.35;
  head.castShadow = true;
  group.add(head);

  const hairCap = new THREE.Mesh(
    new THREE.SphereGeometry(
      0.32, 14, 8, 0, Math.PI * 2, 0, Math.PI * 0.52
    ),
    hair
  );

  hairCap.position.y = 2.43;
  group.add(hairCap);

  const arms = [];
  const legs = [];

  for (const side of [-1, 1]) {

    const arm = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.13, 0.58, 4, 8),
      skin
    );

    arm.position.set(side * 0.52, 1.48, 0);
    group.add(arm);
    arms.push(arm);

    const leg = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.17, 0.68, 4, 8),
      pants
    );

    leg.position.set(side * 0.2, 0.55, 0);
    group.add(leg);
    legs.push(leg);

    const foot = new THREE.Mesh(
      new THREE.BoxGeometry(0.25, 0.14, 0.42),
      shoes
    );

    foot.position.set(side * 0.2, 0.12, 0.09);
    group.add(foot);
  }

  return { group, arms, legs, name };
}

const james = character(
  "James", 0x426f83, 0x303b49, 0, 3
);

const elena = character(
  "Elena", 0xb96f83, 0x4a4059, 8, 22
);

const ryan = character(
  "Ryan", 0x668d59, 0x394b40, -8, 22
);

// ====================================
// VEHICLES
// ====================================

function car(x, z, color) {

  const group = new THREE.Group();
  group.position.set(x, 0.3, z);
  scene.add(group);

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2.5, 0.8, 4.4),
    material(color)
  );

  body.position.y = 0.65;
  body.castShadow = true;
  group.add(body);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.9, 0.8, 2.1),
    material(0x8eb4bd, 0.3)
  );

  cabin.position.set(0, 1.35, -0.2);
  group.add(cabin);

  for (const xx of [-1.05, 1.05]) {
    for (const zz of [-1.4, 1.4]) {

      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.38, 0.38, 0.22, 14),
        material(0x202326)
      );

      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(xx, 0.35, zz);
      group.add(wheel);
    }
  }
}

car(-17, 8, 0x9a4e3e);
car(17, 8, 0x4d6576);
car(50, -5, 0xd4d1c7);


// ====================================
// PLAYER CONTROLS
// ====================================

let cameraYaw = 0;
let jumpHeight = 0;
let jumpVelocity = 0;

let joystick = { x: 0, y: 0 };
let joystickPointerId = null;

const joystickElement = document.querySelector("#joystick");
const stick = document.querySelector("#stick");

function updateJoystick(event) {
  const rect = joystickElement.getBoundingClientRect();

  let dx = event.clientX - (rect.left + rect.width / 2);
  let dy = event.clientY - (rect.top + rect.height / 2);

  const max = 34;
  const length = Math.hypot(dx, dy);

  if (length > max) {
    dx *= max / length;
    dy *= max / length;
  }

  joystick.x = dx / max;
  joystick.y = dy / max;

  stick.style.transform = `translate(${dx}px, ${dy}px)`;
}

function resetJoystick() {
  joystickPointerId = null;
  joystick = { x: 0, y: 0 };
  stick.style.transform = "translate(0,0)";
}

joystickElement.addEventListener("pointerdown", e => {
  e.preventDefault();
  joystickPointerId = e.pointerId;
  joystickElement.setPointerCapture(e.pointerId);
  updateJoystick(e);
});

joystickElement.addEventListener("pointermove", e => {
  if (e.pointerId === joystickPointerId) {
    e.preventDefault();
    updateJoystick(e);
  }
});

joystickElement.addEventListener("pointerup", resetJoystick);
joystickElement.addEventListener("pointercancel", resetJoystick);
joystickElement.addEventListener("lostpointercapture", resetJoystick);

// Camera rotation
let dragging = false;
let previousX = 0;

renderer.domElement.addEventListener("pointerdown", e => {
  if (e.clientX > innerWidth * 0.48) {
    dragging = true;
    previousX = e.clientX;
  }
});

renderer.domElement.addEventListener("pointermove", e => {
  if (dragging) {
    cameraYaw -= (e.clientX - previousX) * 0.006;
    previousX = e.clientX;
  }
});

renderer.domElement.addEventListener("pointerup", () => {
  dragging = false;
});

renderer.domElement.addEventListener("pointercancel", () => {
  dragging = false;
});


// ====================================
// ACTION BUTTONS
// ====================================

let toastTimeout;

function toast(message) {
  const element = document.querySelector("#toast");
  element.textContent = message;
  element.style.opacity = 1;

  clearTimeout(toastTimeout);

  toastTimeout = setTimeout(() => {
    element.style.opacity = 0;
  }, 1500);
}

document.querySelector("#wave").onclick = () => {

  james.arms[1].rotation.z = -1.2;

  toast("James waves hello!");

  setTimeout(() => {
    james.arms[1].rotation.z = 0;
  }, 700);
};

document.querySelector("#talk").onclick = () => {

  const d1 = james.group.position.distanceTo(
    elena.group.position
  );

  const d2 = james.group.position.distanceTo(
    ryan.group.position
  );

  if (Math.min(d1, d2) < 5) {
    toast("You greet your friend!");
  } else {
    toast("Move closer to Elena or Ryan.");
  }
};

document.querySelector("#jump").onclick = () => {

  if (jumpHeight === 0) {
    jumpVelocity = 7;
    toast("Jump!");
  }
};

// ====================================
// CAMERA AND GAME LOOP
// ====================================

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.04);

  const forward = -joystick.y;
  const sideways = joystick.x;

  const moving =
    Math.abs(forward) + Math.abs(sideways) > 0.08;

  if (moving) {

    const direction = new THREE.Vector3(
      sideways, 0, forward
    ).normalize();

    direction.applyAxisAngle(
      new THREE.Vector3(0, 1, 0),
      cameraYaw
    );

    james.group.position.addScaledVector(
      direction, dt * 7
    );

    james.group.rotation.y =
      Math.atan2(direction.x, direction.z);

    const t = clock.elapsedTime * 10;

    for (let i = 0; i < 2; i++) {

      james.legs[i].rotation.x =
        Math.sin(t + i * Math.PI) * 0.55;

      james.arms[i].rotation.x =
        -Math.sin(t + i * Math.PI) * 0.35;
    }

  } else {

    james.legs.forEach(leg => {
      leg.rotation.x *= 0.8;
    });

    james.arms.forEach(arm => {
      arm.rotation.x *= 0.8;
    });
  }

  // Jump physics
  if (jumpVelocity !== 0 || jumpHeight > 0) {

    jumpHeight += jumpVelocity * dt;
    jumpVelocity -= 18 * dt;

    if (jumpHeight <= 0) {
      jumpHeight = 0;
      jumpVelocity = 0;
    }
  }

  james.group.position.y = jumpHeight;

  // World boundaries
  james.group.position.x = THREE.MathUtils.clamp(
    james.group.position.x, -100, 100
  );

  james.group.position.z = THREE.MathUtils.clamp(
    james.group.position.z, -70, 75
  );

  // Third-person follow camera
  const target = new THREE.Vector3(
    james.group.position.x,
    1.5 + jumpHeight,
    james.group.position.z
  );

  const offset = new THREE.Vector3(
    Math.sin(cameraYaw) * 8,
    4.8,
    Math.cos(cameraYaw) * 8
  );

  camera.position.lerp(
    target.clone().add(offset),
    1 - Math.pow(0.001, dt)
  );

  camera.lookAt(target);

  elena.group.rotation.y =
    Math.sin(clock.elapsedTime * 0.5) * 0.25;

  ryan.group.rotation.y =
    Math.cos(clock.elapsedTime * 0.4) * 0.25;

  renderer.render(scene, camera);
}

animate();

// ====================================
// START GAME
// ====================================

document.querySelector("#play").addEventListener("click", function() {
  document.querySelector("#start").style.display = "none";

  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock("landscape").catch(() => {});
  }
});

// ====================================
// RESIZE
// ====================================

window.addEventListener("resize", () => {

  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);
});

</script>
</body>
</html>
